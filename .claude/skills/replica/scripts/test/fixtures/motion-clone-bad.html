<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Deploy card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f3f3f6; color: #0b0b0f; height: 560px; display: grid; place-items: center; }
  .card { width: 520px; padding: 28px; border-radius: 20px; background: #fff; box-shadow: 0 1px 2px #0000000f, 0 12px 32px #0b0b0f14;
    animation: rise 500ms ease-out both, fade 400ms ease both; }
  header { display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: center; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 4px solid #5b4bff; border-right-color: #dcd8ff; }
  h2 { font-size: 20px; line-height: 26px; animation: slide 400ms ease 100ms both; }
  .sub { font-size: 14px; line-height: 20px; color: #6b6b78; animation: slide 400ms ease 100ms both; }
  .pill { display: grid; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; line-height: 20px;
    background: #fff1de; color: #b4610a; animation: flip 200ms ease 900ms both; }
  .pill span { grid-area: 1 / 1; text-align: center; }
  .pill .was { animation: out 200ms ease 900ms both; }
  .pill .now { animation: in 200ms ease 900ms both; }
  .bar { height: 8px; margin: 22px 0 10px; border-radius: 4px; background: #ececf1; overflow: hidden; }
  .fill { width: 100%; height: 100%; border-radius: 4px; background: #5b4bff; animation: fill 600ms linear both; }
  li { display: grid; grid-template-columns: 12px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f4;
    font-size: 16px; line-height: 22px; list-style: none; animation: row 300ms ease both; }
  li:last-child { border-bottom: 0; }
  li .dot { width: 12px; height: 12px; border-radius: 50%; background: #2fb36d; }
  li .t { font-size: 14px; color: #6b6b78; }
  li:nth-child(1) { animation-delay: 200ms; }
  li:nth-child(2) { animation-delay: 320ms; }
  li:nth-child(3) { animation-delay: 440ms; }
  li:nth-child(4) { animation-delay: 560ms; }
  li:nth-child(5) { animation-delay: 680ms; }

  @keyframes rise { from { transform: translateY(28px) scale(0.94); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes slide { from { transform: translateX(-14px); opacity: 0; } }
  @keyframes flip { to { background: #e2f8eb; color: #17824a; } }
  @keyframes out { to { opacity: 0; } }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes fill { from { width: 0; } }
  @keyframes row { from { transform: translateY(14px); opacity: 0; } }
</style>
</head>
<body>
  <section class="card">
    <header>
      <span class="spin"></span>
      <div><h2>Deploying acme-web</h2><p class="sub">main · 3f9c2e1 · 5 steps</p></div>
      <span class="pill"><span class="was">Building</span><span class="now">Live</span></span>
    </header>
    <div class="bar"><div class="fill"></div></div>
    <ul>
      <li><span class="dot"></span><span>Install dependencies</span><span class="t">1.2s</span></li>
      <li><span class="dot"></span><span>Compile 214 modules</span><span class="t">3.4s</span></li>
      <li><span class="dot"></span><span>Optimize images</span><span class="t">0.8s</span></li>
      <li><span class="dot"></span><span>Upload to the edge</span><span class="t">1.1s</span></li>
      <li><span class="dot"></span><span>Warm the cache</span><span class="t">0.4s</span></li>
    </ul>
  </section>
</body>
</html>
