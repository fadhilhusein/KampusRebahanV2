<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bad clone</title>
<style>
  :root { --ink: #0b0b0f; --muted: #5b5b66; --accent: #5b4bff; --line: #e6e6ea; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: #fff; }
  .hero { padding: 96px 64px 72px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
  .hero h1 { font-size: 48px; line-height: 56px; letter-spacing: -1px; font-weight: 700; max-width: 760px; animation: rise 600ms cubic-bezier(0.33, 1, 0.68, 1) both; }
  .hero p { font-size: 18px; line-height: 28px; color: var(--muted); max-width: 520px; animation: rise 300ms linear 120ms both; }
  .actions { display: flex; gap: 12px; animation: rise 600ms cubic-bezier(0.33, 1, 0.68, 1) 240ms both; }
  .btn { padding: 12px 20px; border-radius: 8px; font-size: 16px; line-height: 24px; font-weight: 700; text-decoration: none; }
  .primary { background: #4f46e5; color: #fff; }
  .ghost { border: 1px solid var(--line); color: var(--ink); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 0 64px 96px; }
  .card { border: 1px solid var(--line); border-radius: 4px; padding: 24px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06); }
  .card h3 { font-size: 20px; line-height: 28px; margin-bottom: 8px; }
  .card p { font-size: 15px; line-height: 24px; color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @media (max-width: 600px) {
    .hero { padding: 64px 20px 48px; }
    .hero h1 { font-size: 36px; line-height: 44px; }
    .cards { grid-template-columns: 1fr; padding: 0 20px 48px; }
  }
</style>
</head>
<body>
  <section class="hero">
    <h1>Ship interfaces that feel exactly right</h1>
    <p>Replica measures your rebuild against the reference and tells you what to change next.</p>
    <div class="actions">
      <a class="btn primary" href="#">Get started</a>
      <a class="btn ghost" href="#">Read the docs</a>
    </div>
  </section>
  <section class="cards">
    <div class="card"><h3>Measure</h3><p>Boxes, styles, pixels and motion from both pages.</p></div>
    <div class="card"><h3>Compare</h3><p>Every difference ranked by what fixing it is worth.</p></div>
  </section>
</body>
</html>
