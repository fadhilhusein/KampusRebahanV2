<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Deploy card</title>
<style>
  /* A deploy panel that assembles itself: spring, staggered rows, popping dots, a spinner,
     an eased progress bar and a status flip. */
  :root {
    --spring: linear(0, 0.0465, 0.1644, 0.3237, 0.4991, 0.6706, 0.8242, 0.9513, 1.0479, 1.1138, 1.1516, 1.1657, 1.1613, 1.1439, 1.1185, 1.0897, 1.0608, 1.0345, 1.0123, 0.9951, 0.9831, 0.9758, 0.9727, 0.9728, 0.9753, 0.9793, 0.984, 0.9889, 0.9934, 0.9972, 1.0003, 1.0024, 1.0038, 1.0045, 1.0046, 1.0042, 1.0036, 1.0028, 1.002, 1.0013, 1.0006, 1.0001, 0.9997, 0.9994, 0.9993, 1);
    --out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    --out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
    --in-out-quart: cubic-bezier(0.76, 0, 0.24, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f3f3f6; color: #0b0b0f; height: 560px; display: grid; place-items: center; }
  .card { width: 520px; padding: 28px; border-radius: 20px; background: #fff; box-shadow: 0 1px 2px #0000000f, 0 12px 32px #0b0b0f14;
    animation: rise 900ms var(--spring) both, fade 240ms linear both; }
  header { display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: center; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 4px solid #5b4bff; border-right-color: #dcd8ff;
    animation: turn 1000ms cubic-bezier(0.65, 0, 0.35, 1) 150ms both; }
  h2 { font-size: 20px; line-height: 26px; animation: slide 500ms var(--out-expo) 120ms both; }
  .sub { font-size: 14px; line-height: 20px; color: #6b6b78; animation: slide 500ms var(--out-expo) 180ms both; }
  .pill { display: grid; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; line-height: 20px;
    background: #fff1de; color: #b4610a; animation: flip 260ms ease 1150ms both; }
  .pill span { grid-area: 1 / 1; text-align: center; }
  .pill .was { animation: out 260ms ease 1150ms both; }
  .pill .now { animation: in 260ms ease 1150ms both; }
  .bar { height: 8px; margin: 22px 0 10px; border-radius: 4px; background: #ececf1; overflow: hidden; }
  .fill { width: 100%; height: 100%; border-radius: 4px; background: #5b4bff; animation: fill 950ms var(--in-out-quart) 200ms both; }
  li { display: grid; grid-template-columns: 12px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f4;
    font-size: 16px; line-height: 22px; list-style: none; animation: row 450ms var(--out-quart) both; }
  li:last-child { border-bottom: 0; }
  li .dot { width: 12px; height: 12px; border-radius: 50%; background: #2fb36d; animation: pop 380ms var(--out-back) both; }
  li .t { font-size: 14px; color: #6b6b78; }
  li:nth-child(1) { animation-delay: 300ms; } li:nth-child(1) .dot { animation-delay: 420ms; }
  li:nth-child(2) { animation-delay: 370ms; } li:nth-child(2) .dot { animation-delay: 490ms; }
  li:nth-child(3) { animation-delay: 440ms; } li:nth-child(3) .dot { animation-delay: 560ms; }
  li:nth-child(4) { animation-delay: 510ms; } li:nth-child(4) .dot { animation-delay: 630ms; }
  li:nth-child(5) { animation-delay: 580ms; } li:nth-child(5) .dot { animation-delay: 700ms; }

  @keyframes rise { from { transform: translateY(28px) scale(0.94); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes slide { from { transform: translateX(-14px); opacity: 0; } }
  @keyframes flip { to { background: #e2f8eb; color: #17824a; } }
  @keyframes out { to { opacity: 0; } }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes fill { from { width: 0; } }
  @keyframes row { from { transform: translateY(14px); opacity: 0; } }
  @keyframes pop { from { transform: scale(0); } }
</style>
</head>
<body>
  <section class="card">
    <header>
      <span class="spin"></span>
      <div><h2>Deploying acme-web</h2><p class="sub">main · 3f9c2e1 · 5 steps</p></div>
      <span class="pill"><span class="was">Building</span><span class="now">Live</span></span>
    </header>
    <div class="bar"><div class="fill"></div></div>
    <ul>
      <li><span class="dot"></span><span>Install dependencies</span><span class="t">1.2s</span></li>
      <li><span class="dot"></span><span>Compile 214 modules</span><span class="t">3.4s</span></li>
      <li><span class="dot"></span><span>Optimize images</span><span class="t">0.8s</span></li>
      <li><span class="dot"></span><span>Upload to the edge</span><span class="t">1.1s</span></li>
      <li><span class="dot"></span><span>Warm the cache</span><span class="t">0.4s</span></li>
    </ul>
  </section>
</body>
</html>
