<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Section under a header that reacts to resize</title>
<style>
  /* A header that compacts on resize (a full-page screenshot fires one) above the captured section,
     and an artwork the clone may not reuse, with a caption chip on top. */
  body { margin: 0; font-family: Arial, sans-serif; color: #0b0b0f; }
  header { height: 120px; background: #e4e4ea; }
  .box { position: relative; height: 300px; padding: 40px; }
  .chip { position: absolute; left: 60px; top: 108px; padding: 4px 10px; font-size: 16px; line-height: 22px; background: #fff; color: #0b0b0f; }
  .box p { margin: 0 0 16px; font-size: 24px; line-height: 32px; }
  .after { height: 3000px; }
</style>
</head>
<body>
  <header></header>
  <section class="box">
    <p>Measured where it sits</p>
    <svg width="320" height="160" viewBox="0 0 320 160"><rect width="320" height="160" fill="#5b4bff"/><circle cx="90" cy="80" r="50" fill="#ffd166"/><path d="M180 130l50-80 50 80z" fill="#ef476f"/></svg>
    <b class="chip">New</b>
  </section>
  <div class="after"></div>
  <script>addEventListener('resize', () => (document.querySelector('header').style.height = '80px'));</script>
</body>
</html>
